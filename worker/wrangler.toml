name = "trait-trainer-coach"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# capacitor://localhost is the App Store app.
ALLOWED_ORIGINS = "https://justin-karlin.github.io,capacitor://localhost"
# Models: haiku, sonnet or opus. Each feature starts on the cheap model and moves up
# only when needed: the model declines, gives an invalid reply, flags the request as
# beyond it, the person may be in crisis (reviews), or the model is overloaded or down.
# If every model on the way up is unavailable, smaller ones are tried before giving up.
# "Ask for a more thorough review" starts one tier up.
# Run `npm run model-test` before changing these, and to confirm the defaults.
COACH_MODEL = "haiku"
COACH_MAX_MODEL = "opus"
REVIEW_MODEL = "haiku"
REVIEW_MAX_MODEL = "opus"

# Spending limits (see the README). Each request reserves its worst case before calling
# a model, and the breaker counts reservations as spent. Cheap mode from half the daily
# budget: every request stops at Haiku, except a review that may involve a crisis. Closed
# at the full budget: new AI requests get "resting until tomorrow" (UTC); crisis replies
# already under way may use CRISIS_RESERVE_USD more. DAILY_BUDGET_USD = "0" turns the AI off.
DAILY_BUDGET_USD = "2"
CRISIS_RESERVE_USD = "0.5"
# Per client network (an IPv4 address or an IPv6 /64) per UTC day: AI requests, dollars
# (default a tenth of the budget) and crisis-tier calls in cheap mode. An IPv6 /48 gets 5x
# the requests and crisis calls and a quarter of the budget; an ASN, half the budget.
NETWORK_DAILY_CAP = "40"
# NETWORK_DAILY_USD = "0.2"
# NETWORK_DAILY_CRISIS = "3"

# 10 requests per minute per client network (keyed by the same salted hash as the daily cap).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The day's spend, reservations and per-network counts: one global SQLite-backed Durable
# Object. [env.*] sections don't inherit this binding; repeat it in each, or that
# environment runs in cheap mode with only per-instance caps (and logs an alert).
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limits"]

# Secrets, not vars (set each with `npx wrangler secret put NAME`):
#   ANTHROPIC_API_KEY  required
#   NETWORK_SALT       recommended: a long random string for hashing client networks
#   ADMIN_TOKEN        optional: enables GET /admin/spend
