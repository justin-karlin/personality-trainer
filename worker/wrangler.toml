name = "trait-trainer-coach"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://justin-karlin.github.io"

# 10 requests per minute per IP address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The API key is a secret, not a var: set it with `npx wrangler secret put ANTHROPIC_API_KEY`.
