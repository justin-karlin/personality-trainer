name = "trait-trainer-coach"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# capacitor://localhost is the App Store app.
ALLOWED_ORIGINS = "https://justin-karlin.github.io,capacitor://localhost"
# Models: haiku, sonnet or opus. Each feature starts on the cheap model and moves up
# only when needed: the model declines, gives an invalid reply, flags the request as
# beyond it, the person may be in crisis (reviews), or the model is overloaded or down.
# If every model on the way up is unavailable, smaller ones are tried before giving up.
# "Ask for a more thorough review" starts one tier up.
# Run `npm run model-test` before changing these, and to confirm the defaults.
COACH_MODEL = "haiku"
COACH_MAX_MODEL = "opus"
REVIEW_MODEL = "haiku"
REVIEW_MAX_MODEL = "opus"

# 10 requests per minute per IP address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The API key is a secret, not a var: set it with `npx wrangler secret put ANTHROPIC_API_KEY`.
