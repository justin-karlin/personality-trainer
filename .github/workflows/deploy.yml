name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Built without the AI coach: privacy.html and docs/IOS.md say this version sends nothing to
      # any AI service. To turn it on later, update both first, then pass
      # VITE_COACH_URL: ${{ vars.COACH_URL }} here (see worker/README.md).
      - run: npm run build
        env:
          VITE_COACH_URL: ''
      - name: Test the coach worker
        run: npm ci && npm test && npm run typecheck
        working-directory: worker
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Requires Settings → Pages → Source: "GitHub Actions".
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
